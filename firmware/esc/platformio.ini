; Firmware for the ST B-G431B-ESC1 motor controllers (one per hub motor), using SimpleFOC.
; Build:   pio run
; Upload:  pio run -t upload   (via the on-board ST-LINK)

[env:disco_b_g431b_esc1]
; Pinned: ststm32 v20 ships STM32 Arduino core 3.0, whose enableTimerClock() signature
; SimpleFOC (<= 2.4.0) does not compile against. v19.7.1 ships core 2.12.0.
platform = ststm32@19.7.1
board = disco_b_g431b_esc1
framework = arduino
lib_deps =
    askuric/Simple FOC@^2.3.4
lib_archive = false
monitor_speed = 115200
build_flags =
    -Wall
