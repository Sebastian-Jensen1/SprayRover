; Firmware for the ST B-G431B-ESC1 motor controllers (one per hub motor), using SimpleFOC.
; Build:   pio run
; Upload:  pio run -t upload   (via the on-board ST-LINK)

[env:disco_b_g431b_esc1]
platform = ststm32
board = disco_b_g431b_esc1
framework = arduino
lib_deps =
    askuric/Simple FOC@^2.3.4
lib_archive = false
monitor_speed = 115200
build_flags =
    -Wall
